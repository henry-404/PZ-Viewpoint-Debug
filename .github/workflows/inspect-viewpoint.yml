name: Inspect Viewpoint JAR compatibility

on:
  push:
    paths:
      - ".github/workflows/inspect-viewpoint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Viewpoint release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/henry-404/PZ-Viewpoint-Debug/releases/assets/706132008" \
            -o Viewpoint.jar
          ls -lh Viewpoint.jar ProjectViewpointShelves.jar

      - name: Inspect API and call sites
        shell: bash
        run: |
          mkdir -p reports
          {
            echo "===== PackData declaration and constructor bytecode ====="
            javap -classpath Viewpoint.jar -p -s -c viewpoint.render.PackData
            echo
            echo "===== Viewpoint PackLoads call sites ====="
            javap -classpath Viewpoint.jar -c -p -s viewpoint.packs.PackLoads
            echo
            echo "===== Viewpoint PackModel ====="
            javap -classpath Viewpoint.jar -p -s viewpoint.render.PackModel
            echo
            echo "===== Viewpoint ObjReader ====="
            javap -classpath Viewpoint.jar -c -p -s viewpoint.packs.ObjReader
            echo
            echo "===== Shelves SharedAtlas constructor call sites ====="
            javap -classpath ProjectViewpointShelves.jar -c -p -s pz.viewpointcontainers.SharedAtlas
            echo
            echo "===== PackData references in Viewpoint classes ====="
            for c in $(jar tf Viewpoint.jar | grep '\.class$' | sed 's#/#.#g;s#\.class$##'); do
              javap -classpath Viewpoint.jar -c -p "$c" 2>/dev/null | grep -B 8 -A 8 'PackData."<init>"' && echo "CLASS=$c" || true
            done
          } | tee reports/compatibility-report.txt

      - name: Upload text report
        uses: actions/upload-artifact@v4
        with:
          name: viewpoint-compatibility-report
          path: reports/compatibility-report.txt
          retention-days: 7
